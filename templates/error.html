{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="empty py-5"><i class="bi bi-exclamation-octagon"></i><h1 class="display-5 fw-bold">{{ code }}</h1><p>{{ msg }}</p>
<a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to dashboard</a></div>
{% endblock %}
{% block public %}
<div class="container py-5 text-center"><h1 class="display-5 fw-bold">{{ code }}</h1><p>{{ msg }}</p><a class="btn btn-primary" href="/">Home</a></div>
{% endblock %}
