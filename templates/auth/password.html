{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<div class="card p-4" style="max-width:480px">
  <form method="post">
    <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required></div>
    <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="new" minlength="8" required></div>
    <button class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
