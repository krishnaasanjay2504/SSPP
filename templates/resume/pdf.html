<style>
  @page { size: A4; margin: 1.4cm 1.5cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #222; }

  .rtext { margin: 2px 0 4px 0; line-height: 1.35; }
  .ritem { margin-top: 4px; } .rdate { font-size: 8.5pt; color: #555; }
