{% extends "base.html" %}
{% block title %}Mark attendance{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ e.title }}</h1><p>{{ e.start_at|dt }} · {{ e.venue or '' }}</p></div>
  <form class="d-flex gap-2"><select class="form-select" name="dept" onchange="this.form.submit()"><option value="">All departments</option>{% for d in DEPARTMENTS %}<option {{ 'selected' if dept==d }}>{{ d }}</option>{% endfor %}</select></form></div>
<form method="post" class="card">
  <div class="card-header d-flex justify-content-between"><span>{{ students|length }} students · {{ present|length }} marked present</span>
    <label class="small"><input type="checkbox" class="form-check-input me-1" onclick="document.querySelectorAll('.att').forEach(c=>c.checked=this.checked)">Select all</label></div>
  <div class="card-body row g-2">
    {% for s in students %}<div class="col-md-4 col-xl-3"><label class="opt mb-0"><input type="checkbox" class="form-check-input att" name="present" value="{{ s.id }}" {{ 'checked' if s.id in present }}>{{ s.full_name }} <span class="text-muted small">· {{ s.reg_no }} · {{ s.department }}</span></label></div>{% endfor %}
  </div>
  <div class="card-footer bg-transparent"><button class="btn btn-primary">Save attendance</button></div>
</form>
{% endblock %}
